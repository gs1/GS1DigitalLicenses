<svg xmlns="http://www.w3.org/2000/svg" width="590" height="370" viewBox="0 0 590 370">
  <!-- GS1 orange outer decorative border -->
  <rect x="5" y="5" width="580" height="360" rx="24" ry="24"
        style="fill: none; stroke: #f36f21; stroke-width: 4; stroke-dasharray: 10 4;" />

  <!-- Inner soft frame -->
  <rect x="15" y="15" width="560" height="340" rx="12" ry="12"
        style="fill: #fffdf8; stroke: #ccc; stroke-width: 1.5;" />

  <!-- Background gradient -->
  <defs>
    <linearGradient id="paper-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f5ef; stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect x="15" y="15" width="560" height="340" rx="12" ry="12" fill="url(#paper-bg)" />

  <!-- GS1 Logo -->
  <image href="https://gs1go2.azureedge.net/cdn/ff/-DWrvJ6_9SFLuFoLPq53eDFnZK5ChJZhyMixhk4Vh_M/1746862910/:relative:/themes/custom/gsone_revamp/logo.png"
         x="460" y="30" width="100" height="32" />

  <!-- Credential Title -->
  <text id="credential-name"
        x="295" y="55"
        text-anchor="middle"
        style="font: bold 20px sans-serif; fill: #000;">
    {{name}}
  </text>

  <!-- GS1 Digital Link -->
  <text x="30" y="85" style="font: bold 13px sans-serif; fill: #333;">GS1 ID Key:</text>
  <text x="130" y="85" style="font: 13px monospace; fill: #0057b8;">{{credentialSubject.gs1DigitalLink}}</text>

  <!-- Subject -->
  <text x="30" y="105" style="font: bold 13px sans-serif; fill: #333;">Subject:</text>
  <text x="130" y="105" style="font: 13px monospace; fill: #0057b8;">{{credentialSubject.name}}</text>

  <!-- Delegation section (only rendered when recognizedTo is present) -->
  {{#credentialSubject.recognizedTo}}
  <text x="30" y="130" style="font: bold 13px sans-serif; fill: #333;">Authorizes:</text>
  <text x="130" y="130" style="font: 13px monospace; fill: #0057b8;">{{credentialSubject.id}}</text>

  <text x="30" y="150" style="font: bold 13px sans-serif; fill: #333;">Action:</text>
  <text x="130" y="150" style="font: 13px monospace; fill: #0057b8;">{{credentialSubject.recognizedTo.action}}</text>

  <text x="30" y="170" style="font: bold 13px sans-serif; fill: #333;">Contents:</text>
  <a href="{{credentialSubject.recognizedTo.outputValidation.id}}">
    <text x="130" y="170" style="font: 13px monospace; fill: #0057b8; text-decoration: underline; cursor: pointer;">
      {{#credentialSubject.recognizedTo.outputValidation.name}}{{credentialSubject.recognizedTo.outputValidation.name}}{{/credentialSubject.recognizedTo.outputValidation.name}}{{^credentialSubject.recognizedTo.outputValidation.name}}{{credentialSubject.recognizedTo.outputValidation.id}}{{/credentialSubject.recognizedTo.outputValidation.name}}
    </text>
  </a>
  {{/credentialSubject.recognizedTo}}

  <!-- Description block -->
  <foreignObject x="30" y="190" width="530" height="90">
    <body xmlns="http://www.w3.org/1999/xhtml">
      <p id="vc-description" style="
        font-family: sans-serif;
        font-size: 12px;
        color: #333;
        margin: 0;
        line-height: 1.3em;
      ">
        {{description}}
      </p>
    </body>
  </foreignObject>

  <!-- Recognized In (left) / Issuer (right) -->
  <text x="30" y="320" style="font: bold 13px sans-serif; fill: #333;">Authority:</text>
  <text id="issuer-label" x="560" y="320" text-anchor="end"
        style="font: bold 13px sans-serif; fill: #333;">
    Issuer:
  </text>
  <a href="{{issuer.recognizedIn.id}}">
    <text x="30" y="336" style="font: 10px monospace; fill: #0057b8; text-decoration: underline; cursor: pointer;">
      {{issuer.recognizedIn.name}}
    </text>
  </a>
  <text id="issuer" x="560" y="336" text-anchor="end"
        style="font: italic 13px monospace; fill: #0057b8; text-decoration: underline;">
    {{issuer.name}}
  </text>
</svg>
